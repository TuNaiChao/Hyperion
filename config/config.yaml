# Hyperion 主配置
# - 模型用 `use: <module>:<ClassName>` 声明,工厂用反射加载(加 provider 零代码)。
# - 任何以 $ 开头的值会被解析为环境变量(见 .env)。
# 详见 docs/architecture.md §4.1 / §4.2。

models:
  # —— OpenAI ——
  - name: gpt-4.1
    display_name: GPT-4.1
    use: langchain_openai:ChatOpenAI
    model: gpt-4.1
    api_key: $OPENAI_API_KEY
    base_url: https://api.openai.com/v1
    request_timeout: 600.0
    max_retries: 2
    max_tokens: 8192
    temperature: 0.2
    supports_vision: true

  # —— DeepSeek(OpenAI 兼容,性价比高)——
  - name: deepseek-v4-pro
    display_name: DeepSeek Chat
    use: langchain_openai:ChatOpenAI
    model: deepseek-v4-pro
    api_key: $DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com
    max_tokens: 8192
    temperature: 0.2

  # —— Anthropic(需 uv sync --extra providers)——
  # - name: claude-sonnet
  #   display_name: Claude Sonnet
  #   use: langchain_anthropic:ChatAnthropic
  #   model: claude-sonnet-4-5
  #   api_key: $ANTHROPIC_API_KEY
  #   max_tokens: 8192
  #   supports_thinking: true
  #   supports_vision: true
  #   when_thinking_enabled: { thinking: { type: enabled, budget_tokens: 8000 } }
  #   when_thinking_disabled: { thinking: { type: disabled } }

  # —— 本地 Ollama(零成本;用原生 provider 保留 reasoning)——
  # - name: qwen3-local
  #   use: langchain_ollama:ChatOllama
  #   model: qwen3:32b
  #   base_url: http://localhost:11434
  #   num_predict: 8192
  #   supports_thinking: true

# 角色 → 模型 路由。
# 当前所有角色统一走 deepseek-v4-pro(可用 key);后续接入更强模型(Claude / GPT 等)后,
# 再按"便宜模型做摘要、强模型做定位/写作"分层——届时只改这里,零代码。
model_roles:
  default: deepseek-v4-pro
  planner: deepseek-v4-pro
  locator: deepseek-v4-pro
  summarizer: deepseek-v4-pro
  verifier: deepseek-v4-pro
  memory_extractor: deepseek-v4-pro
  title: deepseek-v4-pro

# 工具分组(声明式;工作流按组挂载工具)。
tool_groups:
  - name: sandbox       # 命令执行
  - name: file:read     # 只读:读文件 / 列目录
  - name: file:write    # 写入:写文件 / 改文件

# 工具(声明式 + 反射加载):每条声明 use: 'module:variable',registry 用反射加载。
# domain 工具(bluez/wpa 解析等)走 tools/plugins/<name>/,按需启用,不改核心。
tools:
  - name: bash
    group: sandbox
    use: hyperion.tools.sandbox:bash_tool
  - name: read_file
    group: file:read
    use: hyperion.tools.sandbox:read_file_tool
  - name: write_file
    group: file:write
    use: hyperion.tools.sandbox:write_file_tool
  - name: str_replace
    group: file:write
    use: hyperion.tools.sandbox:str_replace_tool
  - name: ls
    group: file:read
    use: hyperion.tools.sandbox:ls_tool

# 沙箱 provider + 参数(P0 本地沙箱;P6 换 Docker 时只改 use 即可)。
sandbox:
  use: hyperion.platform.sandbox.provider:LocalSandboxProvider
  workspace: data/sandbox/workspace
  bash_command_timeout: 600
  bash_output_max_chars: 20000
  read_file_output_max_chars: 50000
  ls_output_max_chars: 20000

# 代码理解服务(P1 分阶段搭建,见 docs/p1-code-understanding-design.md)。
# P1.2 先配 embedding;vector_store / retrieval / repo_map 随对应阶段补。
code_index:
  embedding:
    # provider 抽象(像模型工厂):
    #   openai_compatible = 远端 OpenAI 兼容 API(默认;免下载、免 torch,和调 chat 一样配 key)
    #   sentence_transformers = 本地(需 `uv sync --extra embedding-local`;离线 / 数据不出本地)
    provider: openai_compatible
    # —— 远端 OpenAI 兼容(默认:阿里云百炼 DashScope)——
    # 同一份代码,换 base_url + api_key + model 即可切 SiliconFlow / OpenAI / 自建 vLLM。
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key: $DASHSCOPE_API_KEY
    model: text-embedding-v4          # = Qwen3-Embedding 全血版(质量优于本地 0.6B)。换 SiliconFlow:Qwen/Qwen3-Embedding-0.6B 或 BAAI/bge-m3
    dimensions: 1024                  # 输出维度(Qwen3 系列可调 64-2048;bge-m3 不支持此参数、固定 1024)。存取必须同 dim。
    batch_limit: 10                   # 远端每请求文本条数上限(DashScope v4=10;SiliconFlow 更宽)。embed_chunks 自动分批。
    normalize: true                   # 客户端 L2 归一化(API 返回未必归一化,显式做保 cosine 一致)
    # —— 本地 sentence_transformers 模式(provider 改它时才生效)——
    # local_model: Qwen/Qwen3-Embedding-0.6B
    # max_seq_length: 8192            # ⚠️ 本地必须显式设(ST 默认 512 会静默截断长代码)
    # device: cpu                     # cuda / mps
    # hf_endpoint: https://hf-mirror.com
    # query_instruction: query        # Qwen3 用 prompt_name="query";bge-m3 留空
