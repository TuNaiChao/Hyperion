# Hyperion 主配置
# - 模型用 `use: <module>:<ClassName>` 声明,工厂用反射加载(加 provider 零代码)。
# - 任何以 $ 开头的值会被解析为环境变量(见 .env)。
# 详见 docs/architecture.md §4.1 / §4.2。

models:
  # —— OpenAI ——
  - name: gpt-4.1
    display_name: GPT-4.1
    use: langchain_openai:ChatOpenAI
    model: gpt-4.1
    api_key: $OPENAI_API_KEY
    base_url: https://api.openai.com/v1
    request_timeout: 600.0
    max_retries: 2
    max_tokens: 8192
    temperature: 0.2
    supports_vision: true

  # —— DeepSeek(OpenAI 兼容,性价比高)——
  - name: deepseek-v4-pro
    display_name: DeepSeek Chat
    use: langchain_openai:ChatOpenAI
    model: deepseek-v4-pro
    api_key: $DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com
    max_tokens: 8192
    temperature: 0.2

  # —— Anthropic(需 uv sync --extra providers)——
  # - name: claude-sonnet
  #   display_name: Claude Sonnet
  #   use: langchain_anthropic:ChatAnthropic
  #   model: claude-sonnet-4-5
  #   api_key: $ANTHROPIC_API_KEY
  #   max_tokens: 8192
  #   supports_thinking: true
  #   supports_vision: true
  #   when_thinking_enabled: { thinking: { type: enabled, budget_tokens: 8000 } }
  #   when_thinking_disabled: { thinking: { type: disabled } }

  # —— 本地 Ollama(零成本;用原生 provider 保留 reasoning)——
  # - name: qwen3-local
  #   use: langchain_ollama:ChatOllama
  #   model: qwen3:32b
  #   base_url: http://localhost:11434
  #   num_predict: 8192
  #   supports_thinking: true

# 角色 → 模型 路由。
# 当前所有角色统一走 deepseek-v4-pro(可用 key);后续接入更强模型(Claude / GPT 等)后,
# 再按"便宜模型做摘要、强模型做定位/写作"分层——届时只改这里,零代码。
model_roles:
  default: deepseek-v4-pro
  planner: deepseek-v4-pro
  locator: deepseek-v4-pro
  summarizer: deepseek-v4-pro
  verifier: deepseek-v4-pro
  memory_extractor: deepseek-v4-pro
  title: deepseek-v4-pro

# 工具分组(声明式;工作流按组挂载工具)。
tool_groups:
  - name: sandbox       # 命令执行
  - name: file:read     # 只读:读文件 / 列目录
  - name: file:write    # 写入:写文件 / 改文件
  - name: code          # 代码导航(grep/read/search/LSP)
  - name: memory        # 记忆:recall 翻历史 / memorize 记一条

# 工具(声明式 + 反射加载):每条声明 use: 'module:variable',registry 用反射加载。
# domain 工具(bluez/wpa 解析等)走 tools/plugins/<name>/,按需启用,不改核心。
tools:
  - name: bash
    group: sandbox
    use: hyperion.tools.sandbox:bash_tool
  - name: read_file
    group: file:read
    use: hyperion.tools.sandbox:read_file_tool
  - name: write_file
    group: file:write
    use: hyperion.tools.sandbox:write_file_tool
  - name: str_replace
    group: file:write
    use: hyperion.tools.sandbox:str_replace_tool
  - name: ls
    group: file:read
    use: hyperion.tools.sandbox:ls_tool
  # —— P1.4 代码导航工具 ——
  - name: grep_symbol
    group: code
    use: hyperion.tools.code_nav:grep_symbol_tool
  - name: read_function
    group: code
    use: hyperion.tools.code_nav:read_function_tool
  - name: search_code
    group: code
    use: hyperion.tools.code_nav:search_code_tool
  - name: grep
    group: file:read
    use: hyperion.tools.sandbox:grep_tool
  # —— P1.5 L2 精确导航工具(clangd/LSP,需 compile_commands.json)——
  - name: find_references
    group: code
    use: hyperion.tools.code_nav:find_references_tool
  - name: goto_definition
    group: code
    use: hyperion.tools.code_nav:goto_definition_tool
  - name: hover
    group: code
    use: hyperion.tools.code_nav:hover_tool
  # —— R1 记忆工具(deer-flow tool 模式:agent 主动查/写长期记忆)——
  - name: memory_recall
    group: memory
    use: hyperion.tools.memory:memory_recall_tool
  - name: memory_memorize
    group: memory
    use: hyperion.tools.memory:memory_memorize_tool

# 沙箱 provider + 参数(P0 本地沙箱;P6 换 Docker 时只改 use 即可)。
sandbox:
  use: hyperion.platform.sandbox.provider:LocalSandboxProvider
  workspace: data/sandbox/workspace
  bash_command_timeout: 600
  bash_output_max_chars: 20000
  read_file_output_max_chars: 50000
  ls_output_max_chars: 20000

# 代码理解服务(P1 分阶段搭建,见 docs/p1-code-understanding-design.md)。
# P1.2 先配 embedding;vector_store / retrieval / repo_map 随对应阶段补。
code_index:
  repo: hyperion                       # P1.4: search_code 查的表名(须与 build_index 一致;缺省回退 workspace 目录名)
  embedding:
    # provider 抽象(像模型工厂):
    #   openai_compatible = 远端 OpenAI 兼容 API(默认;免下载、免 torch,和调 chat 一样配 key)
    #   sentence_transformers = 本地(需 `uv sync --extra embedding-local`;离线 / 数据不出本地)
    provider: openai_compatible
    # —— 远端 OpenAI 兼容(默认:阿里云百炼 DashScope)——
    # 同一份代码,换 base_url + api_key + model 即可切 SiliconFlow / OpenAI / 自建 vLLM。
    # base_url 走 $ENV:专属 MaaS 端点(如 llm-xxxx.cn-beijing.maas.aliyuncs.com)在 .env 配
    # DASHSCOPE_BASE_URL;不设则 create_embedder 回落 serverless 黉认 dashscope.aliyuncs.com。
    base_url: $DASHSCOPE_BASE_URL
    api_key: $DASHSCOPE_API_KEY
    model: text-embedding-v4          # = Qwen3-Embedding 全血版(质量优于本地 0.6B)。换 SiliconFlow:Qwen/Qwen3-Embedding-0.6B 或 BAAI/bge-m3
    dimensions: 1024                  # 输出维度(Qwen3 系列可调 64-2048;bge-m3 不支持此参数、固定 1024)。存取必须同 dim。
    batch_limit: 10                   # 远端每请求文本条数上限(DashScope v4=10;SiliconFlow 更宽)。embed_chunks 自动分批。
    normalize: true                   # 客户端 L2 归一化(API 返回未必归一化,显式做保 cosine 一致)
    # —— 本地 sentence_transformers 模式(provider 改它时才生效)——
    # local_model: Qwen/Qwen3-Embedding-0.6B
    # max_seq_length: 8192            # ⚠️ 本地必须显式设(ST 默认 512 会静默截断长代码)
    # device: cpu                     # cuda / mps
    # hf_endpoint: https://hf-mirror.com
    # query_instruction: query        # Qwen3 用 prompt_name="query";bge-m3 留空

  # 检索(P1.3 retrieval.py):LanceDB 原生 hybrid(BM25 FTS + 稠密向量)+ RRF 融合 + reranker 重排。
  retrieval:
    rrf_k: 60                          # Cormack 2009 标准,跨 80+ 实验近最优,几乎不用调
    candidate_top_n: 50                # 喂 reranker 的候选池(hybrid 取 top-50)
    final_top_k: 5                     # reranker 后最终返回
    fts_stem: false                    # 代码场景必须关(否则 malloc 等 token 被 stem 乱变)
    fts_remove_stop_words: false       # 代码场景必须关(否则 int/void/public/return 被当英文停用词删掉)
    query_boost: true                  # 查询类型 boosting(PascalCase→Class / snake→Function / dotted→qualified)

  # 重排(P1.3 retrieval.py):provider 抽象,镜像 embedding。默认远端(CPU 本地 257s/100doc 不可交互)。
  # live 测确认:DashScope rerank 走「原生端点」(非 OpenAI 兼容面,compatible-mode/v1/reranks 是 404)。
  reranker:
    provider: dashscope                # dashscope(原生,默认)| siliconflow(Cohere 形态,免费)| sentence_transformers(本地,GPU)| off
    # base_url 走 $ENV:专属 MaaS 端点在 .env 配 DASHSCOPE_RERANK_URL;不设则 create_reranker 回落 serverless 默认。
    base_url: $DASHSCOPE_RERANK_URL
    api_key: $DASHSCOPE_API_KEY        # 与 embedding 同一个 key
    model: qwen3-rerank                # 100+ 语言;¥0.0005/千token(同 embedding 价,≈8 万次查询=¥1)
    rerank_top_n: 5
    # fallback(siliconflow 免费,需 $SILICONFLOW_API_KEY):provider: siliconflow, base_url: https://api.siliconflow.cn/v1/rerank, model: BAAI/bge-reranker-v2-m3

  # L2 精确导航(P1.5 lsp.py):clangd 经 multilspy 驱动。caller/callee(查找引用)、跳定义、hover。
  # 硬前提:仓库根有 compile_commands.json(autotools 用 `bear -- make V=1` 或 `compiledb --parse make -nW V=1`;
  # cmake 用 `cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON`)。没有它 references 质量骤降(见设计文档 §5.7 降级)。
  lsp:
    clangd_path: null          # null = shutil.which("clangd") 自动找;或写绝对路径(如 /usr/bin/clangd)
    extra_args: []             # 追加 clangd flag(如交叉编译 ["--query-driver=/usr/bin/arm-linux-gnueabihf-gcc*"])
    start_timeout: 30          # 起 clangd + initialize 超时(秒)
    request_timeout: 15        # 单次 references/definition/hover 超时(秒)
    index_retry: 1             # 结果为空/偏少时重试次数(防后台索引未就绪)
    index_retry_delay: 0.3     # 重试间隔(秒)
    compile_commands_dir: null # null = clangd 自动从源文件向上找;或写绝对路径强制指定 compile_commands.json 所在目录

# 记忆核心(R1,★P3 差异化):MemoryService 契约 + 可换后端(见 docs/设计/memory-design.md)。
# v1 默认 native —— 组合已有 code_index(语义)+ code-review-graph(结构,可选),不建第三个检索栈。
# 切后端 = 丢 backends/<name>/ 文件夹 + 改 backend 名;mem0/cognee 作可选 extra(零锁死)。
memory:
  backend: native                # native(v1)| mem0 | cognee | 'pkg.mod:Cls'(各自实现 backends/<name>/)
  store_path: data/memory        # native SQLite 落点(知识项 canonical 记录 + FTS5 检索 + 向量 blob)
  native:
    structural: none             # none(默认,不接结构图)| crg(接 code-review-graph;需 `uv sync --extra code-review-graph`)
    embed: code_index            # code_index(复用 code_index 的 embedder 给 KI summary 算向量)| off(只 BM25)
    rerank: code_index           # code_index(复用 code_index 的 reranker 精排 recall)| off(只 RRF 融合)
    recall_top_k: 5              # recall 默认返回条数
    decay_halflife_days: 180.0   # 衰减半衰期(天)—— 简单 exp(-age/halflife);Weibull 留 backlog(mnemopi 也未启用)
    promote_access_count: 3      # 被召回≥N 次 → 升级 mental_model(Letta 3+ 规则)
    merge_step: 0.3              # 重提时 Bayes 置信度累加步长(mnemopi veracity 0.3)
