[project]
name = "rootrecall"
version = "0.1.0"
description = "RootRecall — code & log analysis agent with continuous learning (bug RCA, deep research, PR tracking)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "TuNaiChao" }]
dependencies = [
    # orchestration
    "langgraph>=1.2",
    "langchain>=1.3",
    "langchain-openai>=1.0",
    # config / utils
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "jsonschema>=4.21",  # R2:校验 delegate(opencode)返回的结构化产出契约 JSON(不依赖模型思考模式)
    "markdownify>=0.13",
    "rich>=13.7",
    # code understanding (coding-agent core)
    # 语法解析:每门语言用「独立 grammar 包」(把编译好的 .so 打进 wheel),零联网、可 pin 版本。
    # 不用 tree-sitter-language-pack 1.x —— 它运行时按需从 GitHub releases 下载语法,国内网络被墙(已实测 timeout)。
    # 加新语言 = 加一个 tree-sitter-<lang> 依赖 + 在 parser.py 的 GRAMMARS 注册一条。
    "tree-sitter>=0.25",
    "tree-sitter-python>=0.25",  # Python(deer-flow 首测)
    "tree-sitter-c>=0.21",       # R2:C 语法(wpa_supplicant/bluez 是 C;demo2 金标准 = wpa)
    "lancedb>=0.34,<0.36",  # P1.3:hybrid/Reranker API 已对照 0.34 核实;锁上限避破坏性变更(见设计文档 §6 决策 #8)
    "sqlite-vec>=0.1.9,<0.2",  # 记忆向量 ANN(建议 A):count>阈值切 vec0 KNN,否则 Python loop。SQLite 扩展,零新运行时依赖(只 load_extension)
    "rank-bm25>=0.2.2",
    # L2 精确导航(P1.5):multilspy = 微软 Python LSP client 库,管 JSON-RPC/initialize 握手/文件同步/同步包装。
    # 只用它的通用机制 + 自写 ClangdServer 适配器(multilspy 0.0.15 无 clangd、main 未发版且 cmd 不带 flag,见设计文档 §5.1)。
    # 依赖轻(pygls/lsprotocol/requests/jedi),无 torch/node。
    "multilspy>=0.0.15,<0.1",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "defusedxml>=0.7.1",
    "pypdf>=6.14.2",
    "jieba>=0.42.1",
]

[project.optional-dependencies]
providers = ["langchain-anthropic>=1.0", "langchain-ollama>=1.0"]
# 记忆核心(MemoryService)的**可切换备选后端**——v1 默认 native(组合已有 code_index+code-review-graph,零额外依赖)。
# 这些 extra 只在想把 memory.backend 切到外部框架时才装(对应 backends/<name>/):`uv sync --extra mem0` / `--extra cognee` / `--extra graphiti`。
# v1 不强制装;按 architecture.md §5.2 / memory-design.md §2 的 backend-swap 设计,零锁死。
mem0 = ["mem0ai>=0.1"]
cognee = ["cognee>=0.1.20"]
graphiti = ["graphiti-core>=0.10"]
# MCP server(tools/mcp_memory.py):把记忆暴露给 delegate(omp/opencode)现场查。
# 官方 mcp 包的 FastMCP(stdio)。`uv sync --extra mcp`。轻量(httpx/pydantic 已在核心依赖)。
mcp = ["mcp>=1.2"]
# code-review-graph(backends/native/structural.py):结构路 blast-radius。
# 可选(structural: none 默认);重依赖(tree-sitter/networkx/igraph/watchdog)。
# 只在要结构路时装:`uv sync --extra code-review-graph`。
code-review-graph = ["code-review-graph[communities]>=2.3"]
# 本地 embedding(P1.2 embed.py 的 LocalEmbedder):默认走远端 OpenAI 兼容 API
# (DashScope / SiliconFlow,复用 langchain-openai,零新依赖、不装 torch);只有要离线 /
# 数据不出本地时才装这套(会拉 torch ~800MB+)。`uv sync --extra embedding-local`。
embedding-local = [
    "sentence-transformers>=2.7",
    "transformers>=4.51.0",  # Qwen3-Embedding 要求 >=4.51,否则 KeyError: 'qwen3'
]

# Dev tools live in a dependency group (PEP 735): `uv sync` installs the `dev`
# group by default, so the bare `uv run pytest` / `uv run ruff` documented in
# CLAUDE.md work without `--extra dev`.
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
rootrecall = "rootrecall.cli:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rootrecall"]

[tool.ruff]
# 240 对齐 deer-flow(其 backend/AGENTS.md 明定 line-length 240),容纳详尽中文 docstring。
line-length = 240
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Only collect the project's own tests; the read-only `deer-flow/` reference
# checkout must never be imported by the test runner.
[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--ignore=deer-flow"
